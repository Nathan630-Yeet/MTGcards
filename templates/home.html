<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Card Odds Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>MTG Card Odds Checker</h1>
    <p class="instructions">
  Enter a card name and choose its set code to estimate the odds of opening it in booster packs. 
  You can optionally enable "Compare a second card" to compare odds side-by-side. 
  Set the number of packs you plan to open to update the graph and statistics.
</p>
    <form id="compareForm">
      <div class="card-sections-wrapper">
        <div class="card-section">
          <h2>Card 1</h2>
          <label for="cardName1">Card Name:</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="cardName1" name="cardName1" required />
            <div id="suggestions1" class="autocomplete-suggestions"></div>
          </div>
          <label for="setCode1">Set:</label>
          <select id="setCode1" required>
          
  <option value="" disabled selected>Loading sets...</option>
</select>

        </div>

        <div class="card-section" id="card2Section" style="display: none;">
          <h2>Card 2</h2>
          <label for="cardName2">Card Name:</label>
        
          <div class="autocomplete-wrapper">
            <input type="text" id="cardName2" name="cardName2" />
            <div id="suggestions2" class="autocomplete-suggestions"></div>
          </div>
          <label for="setCode2">Set:</label>
          <select id="setCode2">
            <option value="" disabled selected>Loading sets...</option>
          </select>
          
</select>

        </div>
      </div>

      <label>
        <input type="checkbox" id="compareToggle" />
        Compare a second card?
      </label>

      <label for="packCount">Number of Packs:</label>
      <input type="number" id="packCount" value="30" min="1" max="500" required />

      <button type="submit">Check Odds</button>
    </form>

    <div id="cardResults" class="card-results-wrapper"></div>
    <canvas id="oddsChart" width="400" height="300"></canvas>
      
  
</div>

  <script>
    document.getElementById('compareToggle').addEventListener('change', function () {
      document.getElementById('card2Section').style.display = this.checked ? 'block' : 'none';
    });

    document.getElementById('compareForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const card1 = document.getElementById('cardName1').value;
      const set1 = document.getElementById('setCode1').value;
      const card2 = document.getElementById('cardName2').value;
      const set2 = document.getElementById('setCode2').value;
      const packCount = parseInt(document.getElementById('packCount').value);
      const compareSecond = document.getElementById('compareToggle').checked;

      const res1 = await fetch(`/check-card?name=${encodeURIComponent(card1)}&set=${set1}`);
      const data1 = await res1.json();

      let res2, data2;
      const secondCardEntered = compareSecond && card2 && set2;

      if (secondCardEntered) {
        res2 = await fetch(`/check-card?name=${encodeURIComponent(card2)}&set=${set2}`);
        data2 = await res2.json();
      }

      if (!res1.ok || (secondCardEntered && !res2.ok)) {
        document.getElementById('cardResults').innerHTML = `<p>Error: ${data1.error || (data2 && data2.error)}</p>`;
        return;
      }

      const packs = Array.from({ length: packCount }, (_, i) => i + 1);
      const cardBlocks = [];

      const buildCardBlock = (data, odds, color) => {
        const probabilities = packs.map(n => 1 - Math.pow(1 - odds, n));
        return {
          html: `
            <div class="card-block">
              <h3>${data.card_name} (${data.rarity})</h3>
              <ul>
                <li>Odds in One Pack: ${(odds * 100).toFixed(2)}%</li>
                <li>Expected Copies in ${packCount} Packs: ${(packCount * odds).toFixed(2)}</li>
                <li>Most Likely Outcome: ~${Math.round(packCount * odds)} copies</li>
                <li>Chance of At Least One: ${(100 * (1 - Math.pow(1 - odds, packCount))).toFixed(2)}%</li>
                <li>Chance of No Copies: ${(100 * Math.pow(1 - odds, packCount)).toFixed(2)}%</li>
              </ul>
              ${data.image_url ? `<img src="${data.image_url}" alt="${data.card_name}" class="card-image" />` : ''}
              ${data.price ? `<p class="card-price">Price: $${parseFloat(data.price).toFixed(2)}</p>` : ''}
            </div>
          `,
          label: data.card_name,
          line: probabilities.map(p => (p * 100).toFixed(2)),
          color
        };
      };
      
      const odds1 = parseFloat(data1.estimated_odds.replace('%', '')) / 100;
      cardBlocks.push(buildCardBlock(data1, odds1, 'rgba(75, 192, 192, 1)'));

      if (secondCardEntered) {
        const odds2 = parseFloat(data2.estimated_odds.replace('%', '')) / 100;
        cardBlocks.push(buildCardBlock(data2, odds2, 'rgba(192, 75, 192, 1)'));
      }

      document.getElementById('cardResults').innerHTML =
        `<div class="card-results-inner">${cardBlocks.map(b => b.html).join('')}</div>`;

      const ctx = document.getElementById('oddsChart').getContext('2d');
      if (window.oddsChart && typeof window.oddsChart.destroy === "function") {
  window.oddsChart.destroy();
}

      window.oddsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: packs,
          datasets: cardBlocks.map((b, i) => ({
            label: b.label,
            data: b.line,
            borderColor: b.color,
            fill: false
          }))
        },
        options: {
          scales: {
            x: { title: { display: true, text: 'Number of Packs' } },
            y: { title: { display: true, text: 'Chance (%)' }, min: 0, max: 100 }
          }
        }
      });
    });
  </script>
  <script>
  async function loadSetDropdowns() {
    const response = await fetch("https://api.scryfall.com/sets");
    const data = await response.json();

    // Filter relevant sets (no commander, only playable types)
    const filtered = data.data.filter(set =>
      ["core", "expansion", "remaster", "starter", "funny", "masters", "draft_innovation", "universes_beyond"].includes(set.set_type)
      && !set.name.toLowerCase().includes("commander")
    );

    // Sort by release date descending
    filtered.sort((a, b) => new Date(b.released_at) - new Date(a.released_at));

    const optionsHtml = filtered.map(set =>
      `<option value="${set.code}">${set.name} (${set.code.toUpperCase()})</option>`
    ).join("");

    document.getElementById("setCode1").innerHTML =
      `<option value="" disabled selected>Select a set</option>` + optionsHtml;
    document.getElementById("setCode2").innerHTML =
      `<option value="" disabled selected>Select a set</option>` + optionsHtml;
  }

  loadSetDropdowns();
</script>
<script>
  function setupAutocomplete(inputId, suggestionId) {
    const input = document.getElementById(inputId);
    const suggestionBox = document.getElementById(suggestionId);

    input.addEventListener("input", async () => {
      const query = input.value;
      if (query.length < 2) {
        suggestionBox.innerHTML = "";
        return;
      }

      try {
        const res = await fetch(`https://api.scryfall.com/cards/autocomplete?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        suggestionBox.innerHTML = "";

        data.data.forEach(name => {
          const div = document.createElement("div");
          div.textContent = name;
          div.addEventListener("click", () => {
            input.value = name;
            suggestionBox.innerHTML = "";
          });
          suggestionBox.appendChild(div);
        });
      } catch (err) {
        console.error("Autocomplete error:", err);
        suggestionBox.innerHTML = "";
      }
    });

    document.addEventListener("click", (e) => {
      if (!suggestionBox.contains(e.target) && e.target !== input) {
        suggestionBox.innerHTML = "";
      }
    });
  }

  setupAutocomplete("cardName1", "suggestions1");
  setupAutocomplete("cardName2", "suggestions2");
</script>

</body>
</html>
